<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DISTRISNACKS</title>
    <link rel="icon" href="https://lh3.googleusercontent.com/d/1CoOOZSMmiRmuGCUDOAXsiCJQDKE9doDN">

    <style>
        *{box-sizing:border-box}
        body{margin:0;font-family:Calibri;background:#f4f4f4}
        
        /* HEADER Y LOGO */
        .header-container{background:#88003d;padding:10px;position:sticky;top:0;z-index:100;box-shadow: 0 2px 5px rgba(0,0,0,0.2)}
        .logo-main{display:block;margin:0 auto 10px;height:50px;max-width:100%;object-fit:contain}
        header{display:flex;gap:10px;align-items:center}
        #menuBtn{font-size:26px;cursor:pointer;color:white}
        #buscar{flex:1;padding:10px;border-radius:8px;border:none;outline:none;font-size:16px}

        /* SIDEBAR */
        #sidebar{position:fixed;top:0;left:-280px;width:280px;height:100%;background:white;box-shadow:4px 0 15px rgba(0,0,0,0.3);transition:.3s;padding:20px;z-index:1000;overflow-y:auto}
        #sidebar.activo{left:0}
        .cat{padding:12px;border-bottom:1px solid #eee;cursor:pointer;font-weight:bold;color:#444}
        .cat:hover{background:#f9f9f9}
        #verTodos{background:#88003d;color:white;padding:10px;border-radius:8px;text-align:center;margin-bottom:15px;cursor:pointer}
        .btn-cerrar-menu{width:100%;padding:10px;background:#eee;border:none;border-radius:8px;margin-bottom:15px;cursor:pointer;font-weight:bold}

        /* MARCAS */
        #marcas{display:flex;gap:15px;overflow-x:auto;padding:15px;background:white}
        .marca{text-align:center;font-size:12px;min-width:80px;cursor:pointer}
        .marca img{width:65px;height:65px;border-radius:50%;border:2px solid #88003d;object-fit:cover;background:#f9f9f9}

        /* PRODUCTOS */
        .seccion-titulo{padding:15px 10px 5px;font-size:18px;color:#88003d;font-weight:bold;text-transform:uppercase}
        #productos{padding:10px;display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:110px}
        @media(min-width:700px){#productos{grid-template-columns:repeat(3,1fr);max-width:1000px;margin-left:auto;margin-right:auto}}

        .producto{background:white;border-radius:12px;padding:10px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.1);position:relative;display:flex;flex-direction:column;justify-content:space-between}
        .producto img{width:100%;border-radius:8px;aspect-ratio:1/1;object-fit:cover}
        
        /* PREMIUM STYLE */
        .producto.premium {border: 2px solid #ffbc00; background: #fffdf2; box-shadow: 0 4px 12px rgba(255,188,0,0.2)}
        .premium-tag {position:absolute; top:5px; left:5px; background:#ffbc00; color:#000; font-size:10px; padding:2px 6px; border-radius:4px; font-weight:bold}

        /* DESCUENTOS */
        .badge-desc{position:absolute;top:5px;right:5px;background:#e74c3c;color:white;font-size:12px;padding:4px 8px;border-radius:8px;font-weight:bold}
        .precio-old{text-decoration:line-through;color:#999;font-size:12px;margin-right:5px}
        .nombre{font-size:14px;margin:8px 0;height:34px;overflow:hidden;line-height:1.2}
        .precio{color:#88003d;font-weight:bold;font-size:16px}

        /* CONTROLES */
        .controles{display:flex;justify-content:center;gap:6px;margin-top:10px}
        .controles button{width:32px;height:32px;background:#88003d;color:white;border:none;border-radius:6px;cursor:pointer}
        .controles input{width:50px;text-align:center;border:1px solid #ccc;border-radius:6px}

        /* BURBUJA Y PANEL */
        #burbuja{position:fixed;bottom:20px;right:20px;background:#88003d;color:white;padding:12px 20px;border-radius:30px;z-index:90;box-shadow:0 4px 15px rgba(0,0,0,0.3);cursor:pointer;font-weight:bold}
        #panel{position:fixed;left:0;right:0;bottom:-100%;background:white;height:90%;transition:.4s;border-radius:20px 20px 0 0;padding:20px;overflow-y:auto;z-index:2000;box-shadow:0 -5px 20px rgba(0,0,0,0.2)}
        #panel.activo{bottom:0}

        /* CLIENTES Y PEDIDOS */
        .cliente-selector{background:#f9f9f9;padding:10px;border-radius:10px;margin-bottom:15px;border:1px solid #eee}
        .historial-item{font-size:12px;background:#fff;padding:5px;margin-top:5px;border-radius:4px;border-left:3px solid #88003d}

        .item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #eee}
        .item-info{flex:1}
        .item-precios{text-align:right;margin-right:10px}
        
        #enviar{width:100%;padding:15px;background:#25D366;border:none;border-radius:12px;color:white;font-weight:bold;font-size:16px;margin-top:10px;cursor:pointer}
        #enviar:disabled{background:#ccc;cursor:not-allowed}
        
        /* BOTON IMPRIMIR */
        #imprimir{width:100%;padding:15px;background:#3498db;border:none;border-radius:12px;color:white;font-weight:bold;font-size:16px;margin-top:10px;cursor:pointer}
        #imprimir:disabled{background:#ccc;cursor:not-allowed}

        .btn-vaciar{background:#eee;color:#666;border:none;padding:10px;width:100%;border-radius:8px;margin-top:10px;cursor:pointer}

        /* BOTON FLOTANTE SOPORTE */
        .btn-soporte{position:fixed;bottom:85px;right:20px;background:#00a884;color:white;width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:0 4px 10px rgba(0,0,0,0.2);z-index:80;font-size:24px}

        /* UTILS */
        .hidden{display:none}
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
        footer{background:#111;color:white;padding:30px 20px 120px;text-align:center;font-size:13px}
    </style>
</head>
<body>

<div class="header-container">
    <img src="https://lh3.googleusercontent.com/d/1A1pYLXrHLmGHdXDg0KIoX1mbhQz2CpzG" alt="DISTRISNACKS" class="logo-main">
    <header>
        <span id="menuBtn" onclick="toggleMenu()">☰</span>
        <input id="buscar" placeholder="Buscar producto o marca..." autocomplete="off">
    </header>
</div>

<div id="sidebar">
    <button class="btn-cerrar-menu" onclick="cerrarMenu()">⬅ Cerrar menú</button>
    <div id="verTodos" onclick="limpiarFiltros()">🏠 Ver todo el catálogo</div>
    <div id="menuCats"></div>
</div>

<div id="marcas"></div>

<div id="contenedor-principal"></div>

<a href="https://wa.me/573222643534?text=Hola,%20necesito%20ayuda%20con%20mi%20pedido" class="btn-soporte" target="_blank">💬</a>

<div id="burbuja" onclick="abrirCarrito()">🛒 <span id="items">0</span> | $<span id="totalBarra">0</span></div>

<div id="panel">
    <div style="display:flex; justify-content: space-between; align-items: center;">
        <h2>Tu Carrito</h2>
        <button onclick="panel.classList.remove('activo')" style="border:none; background:none; font-size: 20px; cursor:pointer">✖</button>
    </div>

    <div class="cliente-selector">
        <label><b>Datos del Cliente:</b></label>
        <input id="cliente" placeholder="Nombre completo">
        <input id="negocio" placeholder="Nombre del Negocio / Teléfono">
        <input id="direccion" placeholder="Dirección de entrega">
        <select id="tipo">
            <option value="">Tipo cliente</option>
            <option>Nuevo</option>
            <option>Existente</option>
        </select>
        
        <div id="historial-area" class="hidden">
            <p style="font-size:12px; margin: 10px 0 5px;"><b>Clientes guardados:</b></p>
            <select id="select-clientes" onchange="cargarCliente(this.value)">
                <option value="">-- Seleccionar cliente guardado --</option>
            </select>
            <button onclick="eliminarClienteActual()" style="font-size:10px; margin-top:5px; color:red; border:none; background:none; cursor:pointer">Eliminar cliente seleccionado</button>
        </div>
    </div>

    <div id="lista"></div>
    
    <div style="background:#f9f9f9; padding:15px; border-radius:10px; margin-top:15px">
        <div style="display:flex; justify-content:space-between"><span>Subtotal:</span> <span id="subtotal">0</span></div>
        <div style="display:flex; justify-content:space-between; color:green"><span>Ahorro total:</span> <span id="ahorro">0</span></div>
        <hr>
        <div style="display:flex; justify-content:space-between; font-size:20px; font-weight:bold; color:#88003d">
            <span>TOTAL:</span> $<span id="total">0</span>
        </div>
    </div>

    <div id="mensaje" style="color:red; font-size:13px; margin:10px 0; text-align:center"></div>
    
    <button id="enviar" onclick="enviarPedido()" disabled>Confirmar y Enviar WhatsApp</button>
    <button id="imprimir" onclick="imprimirRecibo()" disabled>🖨 Imprimir Recibo</button>
    <button class="btn-vaciar" onclick="vaciarCarrito()">Reiniciar / Nuevo Pedido</button>
</div>

<footer>
    <b>DISTRISNACKS</b><br>
    Bogotá<br>
    📱 <a href="https://wa.me/573222643534" style="color:white">3222643534</a><br>
    ✉ Distrisnacksgerencia@gmail.com<br><br>
    © <span id="year"></span>
</footer>

<script>
    year.innerText = new Date().getFullYear();

    const SHEET = "https://docs.google.com/spreadsheets/d/1ICjjEbQBt2Ce9vGj6M3iOMPT9P2ldYVeDLbzV15LMhI/export?format=csv&gid=1965298886";
    const MIN_PEDIDO = 25000;
    const MAX_DIGITOS = 999;

    let productos = [];
    let marcas = [];
    let carrito = JSON.parse(localStorage.getItem("carrito_distri") || "{}");
    let clientesDB = JSON.parse(localStorage.getItem("clientes_distri") || "[]");
    
    let marcaFiltro = "";
    let catFiltro = "";

    // Cargar Datos
    fetch(SHEET).then(r => r.text()).then(csv => {
        csv.split(/\r?\n/).slice(1).forEach(f => {
            const c = f.split(",").map(x => (x || "").replace(/"/g,"").trim());
            
            if(c[4] === "SI") {
                let precioBase = parseInt(c[2].replace(/\D/g,"")) || 0;
                let descPorc = parseInt(c[8]) || 0;
                let precioFinal = descPorc > 0 ? Math.round(precioBase * (1 - descPorc/100)) : precioBase;

                productos.push({
                    n: c[1],
                    pOrig: precioBase,
                    p: precioFinal,
                    img: c[3],
                    premium: c[5] === "SI",
                    marca: c[6],
                    cat: c[7],
                    desc: descPorc
                });
            }

            if(c[9] && c[11] === "SI" && c[10]) {
                if(!marcas.find(m => m.nombre === c[9])) {
                    marcas.push({ nombre: c[9], logo: c[10] });
                }
            }
        });
        
        marcas = marcas.filter(m => productos.some(p => p.marca === m.nombre));

        renderSidebar();
        renderMarcas();
        renderProductos();
        renderCarrito();
        actualizarSelectClientes();
    });

    // --- LOGICA DE UI ---

    function toggleMenu() { sidebar.classList.toggle("activo"); }
    function cerrarMenu() { sidebar.classList.remove("activo"); }
    
    document.addEventListener('click', (e) => {
        if (!sidebar.contains(e.target) && !menuBtn.contains(e.target) && sidebar.classList.contains('activo')) {
            cerrarMenu();
        }
    });

    function limpiarFiltros() {
        marcaFiltro = "";
        catFiltro = "";
        buscar.value = "";
        cerrarMenu();
        renderProductos();
    }

    function renderSidebar() {
        const cats = [...new Set(productos.map(p => p.cat).filter(Boolean))];
        let h = "";
        cats.forEach(c => {
            h += `<div class="cat" onclick="filtrarCat('${c}')">${c}</div>`;
        });
        menuCats.innerHTML = h;
    }

    function filtrarCat(c) {
        catFiltro = c;
        marcaFiltro = "";
        buscar.value = "";
        cerrarMenu();
        renderProductos();
    }

    function renderMarcas() {
        marcasDiv.innerHTML = "";
        marcas.forEach(m => {
            marcasDiv.innerHTML += `
                <div class="marca" onclick="filtrarMarca('${m.nombre}')">
                    <img src="${m.logo}">
                    <div>${m.nombre}</div>
                </div>`;
        });
    }

    function filtrarMarca(m) {
        marcaFiltro = m;
        catFiltro = "";
        buscar.value = "";
        renderProductos();
    }

    buscar.oninput = () => {
        if(buscar.value.trim() !== "") {
            catFiltro = "";
            marcaFiltro = "";
        }
        renderProductos();
    };

    const prodContenedor = document.getElementById("contenedor-principal");
    const marcasDiv = document.getElementById("marcas");

    function renderProductos() {
        prodContenedor.innerHTML = "";
        let busqueda = buscar.value.toLowerCase();
        
        let prodsFiltrados = productos.filter(p => {
            let coincideBusqueda = p.n.toLowerCase().includes(busqueda) || p.marca.toLowerCase().includes(busqueda);
            let coincideCat = !catFiltro || p.cat === catFiltro;
            let coincideMarca = !marcaFiltro || p.marca === marcaFiltro;
            return coincideBusqueda && coincideCat && coincideMarca;
        });

        let categoriasPresentes = [...new Set(prodsFiltrados.map(p => p.cat))];
        
        let prodsPromo = prodsFiltrados.filter(p => p.desc > 0);
        if (prodsPromo.length > 0 && !catFiltro && !marcaFiltro) {
            renderSeccion("🔥 PROMOCIONES", prodsPromo);
        }

        categoriasPresentes.forEach(cat => {
            let pCat = prodsFiltrados.filter(p => p.cat === cat);
            if(pCat.length > 0) {
                renderSeccion(cat, pCat);
            }
        });
    }

    function renderSeccion(titulo, lista) {
        let section = document.createElement("div");
        section.innerHTML = `<div class="seccion-titulo">${titulo}</div>`;
        let grid = document.createElement("div");
        grid.id = "productos"; 
        
        lista.forEach(p => {
            const cant = carrito[p.n]?.c || 0;
            const itemHtml = `
                <div class="producto ${p.premium ? 'premium' : ''}">
                    ${p.premium ? '<span class="premium-tag">PREMIUM</span>' : ''}
                    ${p.desc > 0 ? `<span class="badge-desc">-${p.desc}%</span>` : ''}
                    <img src="${p.img}">
                    <div class="nombre">${p.n}</div>
                    <div class="precio">
                        ${p.desc > 0 ? `<span class="precio-old">$${p.pOrig.toLocaleString()}</span>` : ''}
                        $${p.p.toLocaleString()}
                    </div>
                    <div class="controles">
                        <button onclick="chg('${p.n}', -1)">−</button>
                        <input type="number" value="${cant}" onchange="set('${p.n}', this.value)" onfocus="this.select()">
                        <button onclick="chg('${p.n}', 1)">+</button>
                    </div>
                </div>`;
            grid.innerHTML += itemHtml;
        });
        section.appendChild(grid);
        prodContenedor.appendChild(section);
    }

    // --- LOGICA CARRITO ---

    function chg(n, v) {
        const p = productos.find(x => x.n === n);
        let c = (carrito[n]?.c || 0) + v;
        if(c > MAX_DIGITOS) c = MAX_DIGITOS;
        if(c <= 0) delete carrito[n]; 
        else carrito[n] = { c, pr: p.p, po: p.pOrig, prem: p.premium };
        save(); renderCarrito(); renderProductos();
    }

    function set(n, v) {
        let num = parseInt(v) || 0;
        if(num > MAX_DIGITOS) num = MAX_DIGITOS;
        const p = productos.find(x => x.n === n);
        if(num <= 0) delete carrito[n]; 
        else carrito[n] = { c: num, pr: p.p, po: p.pOrig, prem: p.premium };
        save(); renderCarrito(); renderProductos();
    }

    function renderCarrito() {
        let totalVal = 0, subtotalVal = 0, itemsCant = 0, h = "";
        
        for(let k in carrito) {
            let item = carrito[k];
            totalVal += item.pr * item.c;
            subtotalVal += item.po * item.c;
            itemsCant += item.c;
            
            h += `
            <div class="item ${item.prem ? 'premium' : ''}" style="${item.prem ? 'border-left:4px solid #ffbc00; padding-left:5px' : ''}">
                <div class="item-info">
                    <div style="font-size:14px"><b>${k}</b></div>
                    <div style="font-size:12px; color:#88003d">$${item.pr.toLocaleString()} c/u</div>
                </div>
                <div class="controles">
                    <button onclick="chg('${k}',-1)">−</button>
                    <input type="number" value="${item.c}" onchange="set('${k}', this.value)">
                    <button onclick="chg('${k}',1)">+</button>
                </div>
            </div>`;
        }

        lista.innerHTML = h || "<p style='text-align:center; color:#999'>El carrito está vacío</p>";
        total.innerText = totalVal.toLocaleString();
        totalBarra.innerText = totalVal.toLocaleString();
        subtotal.innerText = "$" + subtotalVal.toLocaleString();
        ahorro.innerText = "- $" + (subtotalVal - totalVal).toLocaleString();
        items.innerText = itemsCant;
        
        mensaje.innerText = totalVal < MIN_PEDIDO ? `Pedido mínimo: $${MIN_PEDIDO.toLocaleString()}` : "";
        
        const formularioOK = cliente.value && negocio.value && direccion.value && tipo.value;
        const puedeEnviar = totalVal >= MIN_PEDIDO && formularioOK;
        
        enviar.disabled = !puedeEnviar;
        imprimir.disabled = !puedeEnviar;
    }

    function save() { localStorage.setItem("carrito_distri", JSON.stringify(carrito)); }

    function vaciarCarrito() {
        if(confirm("¿Deseas vaciar el carrito y comenzar un nuevo pedido?")) {
            carrito = {};
            save();
            renderCarrito();
            renderProductos();
        }
    }

    function abrirCarrito() {
        panel.classList.add('activo');
        if(clientesDB.length > 0) historialArea.classList.remove("hidden");
    }

    // --- CLIENTES E HISTORIAL ---
    const historialArea = document.getElementById("historial-area");
    ["cliente", "negocio", "direccion", "tipo"].forEach(x => {
        window[x].oninput = renderCarrito;
    });

    function guardarClienteLocal() {
        if(!cliente.value || !negocio.value) return;
        
        let index = clientesDB.findIndex(c => c.nombre === cliente.value);
        let datos = {
            nombre: cliente.value,
            negocio: negocio.value,
            dir: direccion.value,
            tipo: tipo.value,
            ultimoPedido: carrito
        };

        if(index > -1) clientesDB[index] = datos;
        else clientesDB.push(datos);

        localStorage.setItem("clientes_distri", JSON.stringify(clientesDB));
        actualizarSelectClientes();
    }

    function actualizarSelectClientes() {
        const select = document.getElementById("select-clientes");
        select.innerHTML = '<option value="">-- Seleccionar cliente guardado --</option>';
        clientesDB.forEach(c => {
            select.innerHTML += `<option value="${c.nombre}">${c.nombre} (${c.negocio})</option>`;
        });
        if(clientesDB.length > 0) historialArea.classList.remove("hidden");
    }

    function cargarCliente(nombre) {
        if(!nombre) return;
        const c = clientesDB.find(x => x.nombre === nombre);
        if(c) {
            cliente.value = c.nombre;
            negocio.value = c.negocio;
            direccion.value = c.dir;
            tipo.value = c.tipo;
            if(confirm("¿Cargar también el último pedido de este cliente?")) {
                carrito = c.ultimoPedido || {};
                save();
                renderProductos();
            }
            renderCarrito();
        }
    }

    function eliminarClienteActual() {
        const nombre = document.getElementById("select-clientes").value;
        if(!nombre) return;
        if(confirm("¿Eliminar a este cliente de la base de datos local?")) {
            clientesDB = clientesDB.filter(c => c.nombre !== nombre);
            localStorage.setItem("clientes_distri", JSON.stringify(clientesDB));
            actualizarSelectClientes();
        }
    }

    // --- GENERADOR DE TEXTO (RECIBO Y WHATSAPP) ---
    function construirContenidoPedido() {
        let subtotalVal = 0;
        let totalVal = 0;
        let itemsTxt = "";
        const fecha = new Date().toLocaleString();

        for(let k in carrito) {
            let item = carrito[k];
            let subtotalItem = item.pr * item.c;
            subtotalVal += item.po * item.c;
            totalVal += subtotalItem;
            itemsTxt += `${k}\n${item.c} x $${item.pr.toLocaleString()} = $${subtotalItem.toLocaleString()}\n`;
        }

        let ahorroVal = subtotalVal - totalVal;

        let texto = `DISTRISNACKS\n`;
        texto += `NO RESPONSABLE DE IVA\n`;
        texto += `CUBIDES RIOS DAVID FERNANDO\n`;
        texto += `CC 1032459217\n`;
        texto += `DIR: CR 6 #30-10 SOACHA\n`;
        texto += `EMAIL: DAFERVIDNANDO@GMAIL.COM\n`;
        texto += `TEL: 3222643534\n`;
        texto += `--------------------------------\n`;
        texto += `FECHA: ${fecha}\n`;
        texto += `--------------------------------\n`;
        texto += `CLIENTE: ${cliente.value}\n`;
        texto += `NEGOCIO: ${negocio.value}\n`;
        texto += `DIR. ENTREGA: ${direccion.value}\n`;
        texto += `TIPO: ${tipo.value}\n`;
        texto += `--------------------------------\n`;
        texto += itemsTxt;
        texto += `--------------------------------\n`;
        texto += `Subtotal: ${subtotalVal.toLocaleString()}\n`;
        texto += `Descuentos: -${ahorroVal.toLocaleString()}\n`;
        texto += `TOTAL A PAGAR: ${totalVal.toLocaleString()}\n`;
        texto += `Usted ahorro: ${ahorroVal.toLocaleString()}\n`;
        texto += `--------------------------------\n`;
        texto += `No responsable de IVA segun art.\n437 E.T. - Este recibo no genera\nimpuestos descontables ni derecho\na credito fiscal.\n`;
        
        return texto;
    }

    // --- ACCIONES FINALES ---

    function enviarPedido() {
        guardarClienteLocal();
        const texto = construirContenidoPedido();
        // Para WhatsApp usamos un formato con negritas simples
        let m = "*NUEVO PEDIDO - DISTRISNACKS*\n" + texto;
        window.open("https://wa.me/573222643534?text=" + encodeURIComponent(m));
    }

    function imprimirRecibo() {
        guardarClienteLocal();
        const texto = construirContenidoPedido();
        // Redirección directa al esquema RawBT
        window.location.href = "rawbt://print?text=" + encodeURIComponent(texto);
    }
</script>

</body>
</html>
