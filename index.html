<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>DistriSnacks</title>

<style>
body{
  margin:0;
  font-family:Calibri,Arial,sans-serif;
  background:#fafafa;
}

header{
  background:#88003d;
  padding:10px;
}

#search{
  width:100%;
  padding:12px;
  border-radius:8px;
  border:none;
  font-size:16px;
}

#productos{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:14px;
  padding:14px;
}

@media(max-width:600px){
  #productos{grid-template-columns:repeat(2,1fr);}
}

.card{
  background:#fff;
  border-radius:12px;
  padding:10px;
  text-align:center;
  box-shadow:0 2px 6px rgba(0,0,0,.1);
}

.card img{
  max-width:100%;
  height:140px;
  object-fit:contain;
}

.nombre{margin-top:6px;}
.precio{color:#88003d;font-weight:bold;font-size:18px;}

.ctrl{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:6px;
  margin-top:6px;
}

.ctrl button{
  background:#88003d;
  color:#fff;
  border:none;
  width:32px;
  height:32px;
  border-radius:6px;
  font-size:18px;
}

.ctrl input{
  width:50px;
  text-align:center;
}

/* quitar flechas */
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{
  -webkit-appearance:none;margin:0;
}
input[type=number]{-moz-appearance:textfield;}

#carrito{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#fff;
  border-top:2px solid #88003d;
  padding:8px;
}

#lista{font-size:13px;max-height:90px;overflow:auto;}

#enviar{
  width:100%;
  margin-top:6px;
  padding:12px;
  background:#25d366;
  border:none;
  color:#fff;
  font-size:18px;
  border-radius:8px;
}

footer{
  margin-top:140px;
  background:#000;
  color:#fff;
  text-align:center;
  padding:20px;
}
</style>
</head>

<body>

<header>
<input id="search" placeholder="Buscar productos...">
</header>

<div id="productos"></div>

<div id="carrito">
<div><b>Pedido</b></div>
<div>Total: $<span id="total">0</span> | <span id="unds">0</span> und</div>
<div id="lista"></div>

<input id="nombre" placeholder="Nombre">
<input id="direccion" placeholder="Dirección">
<input id="negocio" placeholder="Negocio">
<select id="cliente">
<option value="">Cliente?</option>
<option>Nuevo</option>
<option>Existente</option>
</select>

<button id="enviar">Enviar pedido</button>
</div>

<footer>
<b>DISTRISNACKS</b><br>
Bogotá<br>
3222643534<br>
Distrisnacksgerencia@gmail.com<br>
L–V 8–6 | S 8–1<br>
Tu aliado en distribución TAT
</footer>

<script>
const SHEET="https://docs.google.com/spreadsheets/d/e/2PACX-1vTbugSqKIqAJ2ulSdijJDb94_ENrqE1mtXs2yo1Yz3wjxY7Jers8hh3TDJ4sxoA6CwJ2cIHGwVWGx0I/gviz/tq?tqx=out:json";

const MAX=999;
let productos=[];
let carrito={};

fetch(SHEET).then(r=>r.text()).then(t=>{
 const j=JSON.parse(t.substr(47).slice(0,-2));
 j.table.rows.forEach(r=>{
   if(r.c[4]?.v!=="SI") return;
   productos.push({
     n:r.c[1]?.v,
     p:parseInt(r.c[2]?.v),
     i:r.c[3]?.v
   });
 });
 renderProductos();
});

function renderProductos(){
 const q=document.getElementById("search").value.toLowerCase();
 const cont=document.getElementById("productos");
 cont.innerHTML="";
 productos.filter(p=>p.n.toLowerCase().includes(q)).forEach(p=>{
   const c=carrito[p.n]?.c||0;
   cont.innerHTML+=`
   <div class="card">
     <img src="${p.i}">
     <div class="nombre">${p.n}</div>
     <div class="precio">$${p.p}</div>
     <div class="ctrl">
       <button onclick="chg('${p.n}',-1)">−</button>
       <input type="number" value="${c}" oninput="setv('${p.n}',this.value)">
       <button onclick="chg('${p.n}',1)">+</button>
     </div>
   </div>`;
 });
}

function chg(n,v){
 let c=(carrito[n]?.c||0)+v;
 if(c>MAX)c=MAX;
 if(c<0)c=0;
 const p=productos.find(x=>x.n==n);
 if(c==0) delete carrito[n];
 else carrito[n]={c,pr:p.p};
 render();
}

function setv(n,v){
 if(v==="")return;
 let c=parseInt(v);
 if(isNaN(c))return;
 if(c>MAX)c=MAX;
 if(c<0)c=0;
 const p=productos.find(x=>x.n==n);
 if(c==0) delete carrito[n];
 else carrito[n]={c,pr:p.p};
 render();
}

function render(){
 let t=0,u=0,html="";
 for(let k in carrito){
   const s=carrito[k].c*carrito[k].pr;
   t+=s;u+=carrito[k].c;
   html+=`${carrito[k].c} x ${k} = $${s}<br>`;
 }
 document.getElementById("total").innerText=t;
 document.getElementById("unds").innerText=u;
 document.getElementById("lista").innerHTML=html;
 renderProductos();
}

document.getElementById("search").oninput=renderProductos;

document.getElementById("enviar").onclick=()=>{
 if(!nombre.value||!direccion.value||!negocio.value||!cliente.value){
   alert("Completa tus datos");
   return;
 }
 if(Object.keys(carrito).length==0){
   alert("Carrito vacío");
   return;
 }
 let msg=`Pedido DistriSnacks%0A${nombre.value}%0A${negocio.value}%0A${direccion.value}%0ACliente:${cliente.value}%0A%0A`;
 let total=0;
 for(let k in carrito){
   const s=carrito[k].c*carrito[k].pr;
   total+=s;
   msg+=`${carrito[k].c} x ${k} = $${s}%0A`;
 }
 msg+=`%0ATotal: $${total}`;
 window.open("https://wa.me/573222643534?text="+msg);
};
</script>

</body>
</html>
