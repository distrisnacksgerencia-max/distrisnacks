<html lang="es">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        *{box-sizing:border-box}
        body{margin:0;font-family:Calibri, sans-serif;background:#f4f4f4;color:#222}

        .header-container{background:#88003d;padding:15px 15px 5px 15px;position:sticky;top:0;z-index:100;box-shadow:0 4px 15px rgba(0,0,0,0.3);border-bottom:3px solid #d4af37;}

        #buscar{flex:1;padding:10px;border-radius:8px;border:none;outline:none;font-size:16px}

        #marcas{

            background:rgba(255,255,255,0.95);border-radius:8px;margin-top:5px;scrollbar-width:thin;

        .marca:nth-child(2){margin-top:4px}.marca:nth-child(2)::before{height:26px}
        .marca:nth-child(3){margin-top:20px}.marca:nth-child(3)::before{height:10px}
        .marca:nth-child(4){margin-top:8px}.marca:nth-child(4)::before{height:22px}
        .marca:nth-child(5){margin-top:16px}.marca:nth-child(5)::before{height:14px}
        .marca:nth-child(6){margin-top:2px}.marca:nth-child(6)::before{height:28px}

        .cat{padding:12px;border-bottom:1px solid #eee;cursor:pointer;font-weight:bold;color:#444}
        .cat:hover{background:#f9f9f9}
        #verTodos{background:#88003d;color:white;padding:10px;border-radius:8px;text-align:center;margin-bottom:15px;cursor:pointer}
        .btn-cerrar-menu{width:100%;padding:10px;background:#eee;border:none;border-radius:8px;margin-bottom:15px;cursor:pointer;font-weight:bold}

        }
    </style>

<script>
    const yearEl = document.getElementById('year');
    const SHEET = "https://docs.google.com/spreadsheets/d/1ICjjEbQBt2Ce9vGj6M3iOMPT9P2ldYVeDLbzV15LMhI/export?format=csv&gid=1965298886";
    const MIN_PEDIDO = 25000;
    const MAX_VALOR = 999;

    let productos = [];
    let marcas = [];
    let carrito = safeLoad('carrito_distri', {});
    let clientesDB = safeLoad('clientes_distri', []);
    let marcaFiltro = '';
    let catFiltro = '';
    let diaElegido = '';
    const state = { busqueda: '' };

    const buscar = document.getElementById('buscar');
    const sidebar = document.getElementById('sidebar');
    const menuCats = document.getElementById('menuCats');
    const prodContenedor = document.getElementById('contenedor-principal');
    const marcasDiv = document.getElementById('marcas');
    const panel = document.getElementById('panel');
    const historialArea = document.getElementById('historial-area');
    const cliente = document.getElementById('cliente');
    const negocio = document.getElementById('negocio');
    const direccion = document.getElementById('direccion');
    const tipo = document.getElementById('tipo');
    const mensaje = document.getElementById('mensaje');

    yearEl.innerText = new Date().getFullYear();

    function safeLoad(key, fallback) {
        try {
            const raw = localStorage.getItem(key);
            return raw ? JSON.parse(raw) : fallback;
        } catch (error) {
            console.warn('No se pudo leer localStorage:', key, error);
            return fallback;
        }
    }

    function saveStorage(key, value) {
        try {
            localStorage.setItem(key, JSON.stringify(value));
        } catch (error) {
            console.warn('No se pudo guardar localStorage:', key, error);
        }
    }

    function escapeHtml(value = '') {
        return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    function slugify(value = '') {
        return String(value)
            .toLowerCase()
            .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
            .replace(/[^a-z0-9]+/g, '-')
            .replace(/^-+|-+$/g, '')
            .slice(0, 50) || 'item';
    }

    function parseCsvLine(line) {
        const result = [];
        let current = '';
        let inQuotes = false;

        for (let i = 0; i < line.length; i++) {
            const char = line[i];
            const next = line[i + 1];

            if (char === '"') {
                if (inQuotes && next === '"') {
                    current += '"';
                    i++;
                } else {
                    inQuotes = !inQuotes;
                }
            } else if (char === ',' && !inQuotes) {
                result.push(current);
                current = '';
            } else {
                current += char;
            }
        }

        result.push(current);
        return result.map(value => value.trim().replace(/^"(.*)"$/, '$1'));
    }

    function getProductById(productId) {
        return productos.find(product => product.id === productId) || null;
    }

    function saveCart() {
        saveStorage('carrito_distri', carrito);
    }

    function cargarSesionGuardada() {
        const sesionGuardada = safeLoad('distri_sesion', {});
        if (sesionGuardada.cliente) cliente.value = sesionGuardada.cliente;
        if (sesionGuardada.negocio) negocio.value = sesionGuardada.negocio;
        if (sesionGuardada.direccion) direccion.value = sesionGuardada.direccion;
        if (sesionGuardada.tipo) tipo.value = sesionGuardada.tipo;
    }

    function bindSessionInputs() {
        ['cliente', 'negocio', 'direccion', 'tipo'].forEach((id) => {
            const el = document.getElementById(id);
            if (!el) return;

            el.addEventListener('input', () => {
                const data = {
                    cliente: cliente.value,
                    negocio: negocio.value,
                    direccion: direccion.value,
                    tipo: tipo.value
                };
                saveStorage('distri_sesion', data);
                renderCarrito();
            });
        });
    }

    function renderSidebar() {
        const cats = [...new Set(productos.map(p => p.cat).filter(Boolean))];
        menuCats.innerHTML = cats.map(cat => `
            <div class="cat" role="button" tabindex="0" data-cat="${escapeHtml(cat)}">${escapeHtml(cat)}</div>
        `).join('');
    }

    function renderMarcas() {
        marcasDiv.innerHTML = marcas.map(m => `
            <button class="marca" type="button" data-marca="${escapeHtml(m.nombre)}" aria-label="Filtrar marca ${escapeHtml(m.nombre)}">
                <img src="${m.logo}" alt="${escapeHtml(m.nombre)}">
                <div>${escapeHtml(m.nombre)}</div>
            </button>
        `).join('');
    }

    function renderProductos() {
        prodContenedor.innerHTML = '';
        const busqueda = state.busqueda.trim().toLowerCase();

        const filtrados = productos.filter(product => {
            const searchMatch = !busqueda ||
                product.n.toLowerCase().includes(busqueda) ||
                product.marca.toLowerCase().includes(busqueda);
            const categoriaMatch = !catFiltro || product.cat === catFiltro;
            const marcaMatch = !marcaFiltro || product.marca === marcaFiltro;
            return searchMatch && categoriaMatch && marcaMatch;
        });

        if (filtrados.length === 0) {
            prodContenedor.innerHTML = '<div class="empty-state">No se encontraron productos con esos filtros.</div>';
            return;
        }

        const categorias = [...new Set(filtrados.map(p => p.cat).filter(Boolean))];

        categorias.forEach(categoria => {
            const items = filtrados.filter(p => p.cat === categoria);
            if (items.length > 0) renderSeccion(categoria, items);
        });
    }

    function renderCarrito() {
        let tot = 0;
        let sub = 0;
        let itemC = 0;
        let h = '';

        Object.keys(carrito).forEach((key) => {
            const item = carrito[key];
            const prod = getProductById(key);
            const label = prod ? prod.n : key;
            const unitPrice = Number(item.pr || 0);
            const originalPrice = Number(item.po || 0);
            const qty = Number(item.c || 0);

            tot += unitPrice * qty;
            sub += originalPrice * qty;
            itemC += qty;

            h += `
                <div class="item ${item.prem ? 'premium' : ''}">
                    <div class="item-info">
                        <div><b>${escapeHtml(label)}</b></div>
                        <div style="font-size:12px; color:#88003d">$${unitPrice.toLocaleString()} c/u</div>

                        <button type="button" data-action="qty" data-id="${key}" data-delta="-1" style="font-size:16px; border:none; background:none; cursor:pointer; color:#88003d">−</button>
                        <span>${qty}</span>
                        <button type="button" data-action="qty" data-id="${key}" data-delta="1" style="font-size:16px; border:none; background:none; cursor:pointer; color:#88003d">+</button>
                    </div>
                </div>
            `;
        });

        const lista = document.getElementById('lista');
        lista.innerHTML = h || "<p style='text-align:center; color:#999'>El carrito está vacío</p>";

        document.getElementById('total').innerText = tot.toLocaleString();
        document.getElementById('totalBarra').innerText = tot.toLocaleString();
        document.getElementById('subtotal').innerText = '$' + sub.toLocaleString();
        document.getElementById('ahorro').innerText = '- $' + (sub - tot).toLocaleString();
        document.getElementById('items').innerText = itemC;

        const faltante = Math.max(0, MIN_PEDIDO - tot);
        mensaje.innerText = tot < MIN_PEDIDO ? `Faltan $${faltante.toLocaleString()} para alcanzar el pedido mínimo.` : '';

        const ok = Boolean(cliente.value && negocio.value && direccion.value && tipo.value && tot >= MIN_PEDIDO);
        document.getElementById('enviar').disabled = !ok;
        document.getElementById('btn-imprimir').disabled = !ok;
    }

    function chg(productId, delta) {
        const product = getProductById(productId);
        if (!product) return;

        let currentQty = carrito[productId]?.c || 0;
        let nextQty = currentQty + delta;

        if (nextQty > MAX_VALOR) nextQty = MAX_VALOR;
        if (nextQty <= 0) {
            delete carrito[productId];
        } else {
            carrito[productId] = {
                c: nextQty,
                pr: product.p,
                po: product.pOrig,
                prem: product.premium
            };
        }

        saveCart();
        renderCarrito();
        renderProductos();
    }

    function setProductQty(productId, rawValue) {
        const product = getProductById(productId);
        if (!product) return;

        let num = parseInt(rawValue, 10) || 0;
        if (num > MAX_VALOR) num = MAX_VALOR;

        if (num <= 0) {
            delete carrito[productId];
        } else {
            carrito[productId] = {
                c: num,
                pr: product.p,
                po: product.pOrig,
                prem: product.premium
            };
        }

        saveCart();
        renderCarrito();
        renderProductos();
    }

    function validarCant(el) {
        if (el.value.length > 3) el.value = el.value.slice(0, 3);
        if (parseInt(el.value, 10) > MAX_VALOR) el.value = MAX_VALOR;
    }

    function setupEventDelegation() {
        document.addEventListener('click', (event) => {
            const menuBtn = event.target.closest('#menuBtn');
            if (menuBtn) {
                toggleMenu();
                return;
            }

            const closeMenuBtn = event.target.closest('.btn-cerrar-menu');
            if (closeMenuBtn) {
                cerrarMenu();
                return;
            }

            const cerrarSidebar = event.target.closest('#verTodos');
            if (cerrarSidebar) {
                limpiarFiltros();
                return;
            }

            const marcaBtn = event.target.closest('.marca');
            if (marcaBtn) {
                filtrarMarca(marcaBtn.dataset.marca);
                return;
            }

            const catBtn = event.target.closest('.cat');
            if (catBtn) {
                filtrarCat(catBtn.dataset.cat);
                return;
            }

            const qtyBtn = event.target.closest('[data-action="qty"]');
            if (qtyBtn) {
                const { id, delta } = qtyBtn.dataset;
                chg(id, Number(delta));
                return;
            }

            const infoBtn = event.target.closest('[data-action="details"]');
            if (infoBtn) {
                verDetalles(infoBtn.dataset.id);
                return;
            }

            const cerrarCarritoBtn = event.target.closest('#cerrarCarrito');
            if (cerrarCarritoBtn) {
                panel.classList.remove('activo');
                return;
            }

            const burbuja = event.target.closest('#burbuja');
            if (burbuja) {
                panel.classList.add('activo');
                if (clientesDB.length > 0) historialArea.classList.remove('hidden');
                return;
            }

            const enviarBtn = event.target.closest('#enviar');
            if (enviarBtn) {
                mostrarConfirmacion();
                return;
            }

            const imprimirBtn = event.target.closest('#btn-imprimir');
            if (imprimirBtn) {
                imprimirPedido();
                return;
            }

            const resetBtn = event.target.closest('.btn-vaciar');
            if (resetBtn) {
                if (confirm('¿Deseas vaciar el carrito?')) {
                    carrito = {};
                    saveCart();
                    renderCarrito();
                    renderProductos();
                }
                return;
            }

            const closeConfirm = event.target.closest('.close-modal-float');
            if (closeConfirm) {
                cerrarConfirmacion();
                return;
            }

            const closeInfo = event.target.closest('.close-modal');
            if (closeInfo) {
                cerrarModalInfo();
                return;
            }

            const btnDia = event.target.closest('.btn-dia');
            if (btnDia) {
                seleccionarDia(btnDia, btnDia.dataset.dia);
                return;
            }

            const btnConfirm = event.target.closest('#btn-confirmar-wa');
            if (btnConfirm) {
                procesarEnvioFinal();
                return;
            }

            const cancelConfirm = event.target.closest('.btn-final.cancelar');
            if (cancelConfirm) {
                cerrarConfirmacion();
                return;
            }

            const selectCliente = event.target.closest('#select-clientes');
            if (selectCliente) {
                cargarCliente(selectCliente.value);
                return;
            }

            const deleteClient = event.target.closest('#eliminarClienteBtn');
            if (deleteClient) {
                eliminarClienteActual();
                return;
            }
        });

        document.addEventListener('input', (event) => {
            const qtyInput = event.target.closest('.qty-input');
            if (qtyInput) {
                validarCant(qtyInput);
                setProductQty(qtyInput.dataset.id, qtyInput.value);
            }
        });

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' && event.target.closest('#verTodos')) {
                limpiarFiltros();
            }

            if (event.key === 'Enter' && event.target.closest('#menuBtn')) {
                toggleMenu();
            }

            if (event.key === 'Escape') {
                cerrarMenu();
                panel.classList.remove('activo');
                cerrarConfirmacion();
                cerrarModalInfo();
            }
        });
    }

    function iniciarSnow() {
        const snowCanvas = document.createElement('canvas');
        snowCanvas.style.position = 'fixed';
        snowCanvas.style.top = '0';
        snowCanvas.style.left = '0';
        snowCanvas.style.width = '100%';
        snowCanvas.style.height = '100%';
        snowCanvas.style.pointerEvents = 'none';
        snowCanvas.style.zIndex = '9999';
        document.body.appendChild(snowCanvas);

        const sCtx = snowCanvas.getContext('2d');
        let sWidth = snowCanvas.width = window.innerWidth;
        let sHeight = snowCanvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            sWidth = snowCanvas.width = window.innerWidth;
            sHeight = snowCanvas.height = window.innerHeight;
        });

        let snowflakes = [];
        const maxSnowflakes = 140;

        for (let i = 0; i < maxSnowflakes; i++) {
            snowflakes.push({
                x: Math.random() * sWidth,
                y: Math.random() * sHeight,
                radius: Math.random() * 3.5 + 1.2,
                density: Math.random() * 20,
                speed: Math.random() * 1.5 + 0.8
            });
        }

        function updateSnow() {
            let angle = 0;
            angle += 0.01;
            for (let i = 0; i < snowflakes.length; i++) {
                const sf = snowflakes[i];
                sf.y += sf.speed + Math.cos(angle + sf.density) * 0.3;
                sf.x += Math.sin(angle) * 0.5;

                if (sf.y > sHeight) {
                    sf.y = 0;
                    sf.x = Math.random() * sWidth;
                }
            }
        }

        function drawSnow() {
            sCtx.clearRect(0, 0, sWidth, sHeight);
            sCtx.shadowColor = 'rgba(0, 0, 0, 0.35)';
            sCtx.shadowBlur = 4;
            sCtx.shadowOffsetX = 1;
            sCtx.shadowOffsetY = 1;
            sCtx.fillStyle = 'rgba(255, 255, 255, 0.95)';
            sCtx.beginPath();

            for (let i = 0; i < snowflakes.length; i++) {
                const sf = snowflakes[i];
                sCtx.moveTo(sf.x, sf.y);
                sCtx.arc(sf.x, sf.y, sf.radius, 0, Math.PI * 2, true);
            }

            sCtx.fill();
            updateSnow();
        }

        setInterval(drawSnow, 25);
    }

    function loadCatalog() {
        prodContenedor.innerHTML = '<div class="loading-state">Cargando catálogo...</div>';

        fetch(SHEET)
            .then(response => {
                if (!response.ok) throw new Error(`Error cargando la hoja: ${response.status}`);
                return response.text();
            })
            .then(csv => {
                const lines = csv.split(/\r?\n/).filter(line => line.trim() !== '');
                if (lines.length <= 1) {
                    throw new Error('La hoja no tiene filas de datos');
                }

                lines.slice(1).forEach((line, index) => {
                    const c = parseCsvLine(line);
                    if (c.length < 16) return;

                    const nombre = (c[1] || '').trim();
                    const activo = (c[4] || '').trim();
                    if (activo !== 'SI' || !nombre) return;

                    const pBase = parseInt((c[2] || '').replace(/\D/g, ''), 10) || 0;
                    const dPorc = parseInt((c[8] || '').replace(/\D/g, ''), 10) || 0;
                    const pvp = parseInt((c[13] || '').replace(/\D/g, ''), 10) || 0;
                    const productId = `p-${slugify(nombre)}-${index}`;

                    productos.push({
                        id: productId,
                        n: nombre,
                        pOrig: pBase,
                        p: dPorc > 0 ? Math.round(pBase * (1 - dPorc / 100)) : pBase,
                        img: c[3] || '',
                        premium: (c[5] || '').trim() === 'SI',
                        marca: (c[6] || '').trim(),
                        cat: (c[7] || '').trim(),
                        descPorc: dPorc,
                        pvp,
                        detalle: (c[15] || '').trim()
                    });

                    const marcaNombre = (c[9] || '').trim();
                    const marcaLogo = (c[10] || '').trim();
                    if (marcaNombre && (c[11] || '').trim() === 'SI' && marcaLogo && !marcas.some(item => item.nombre === marcaNombre)) {
                        marcas.push({ nombre: marcaNombre, logo: marcaLogo });
                    }
                });

                marcas = marcas.filter(marca => productos.some(product => product.marca === marca.nombre));
                renderSidebar();
                renderMarcas();
                renderProductos();
                renderCarrito();
                actualizarSelectClientes();

                const urlParams = new URLSearchParams(window.location.search);
                const prodId = urlParams.get('prod');
                if (prodId) {
                    setTimeout(() => verDetalles(prodId), 500);
                }
            })
            .catch(error => {
                console.error(error);
                prodContenedor.innerHTML = '<div class="empty-state">No se pudo cargar el catálogo. Intenta recargar la página.</div>';
            });
    }

    cargarSesionGuardada();
    bindSessionInputs();
    setupEventDelegation();
    iniciarSnow();
    loadCatalog();
</script>
</body>
</html>
