<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DistriSnacks</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Calibri,Arial;
 background:#fff;
}

header{
 background:#88003d;
 color:white;
 padding:14px;
 text-align:center;
}

/* Productos */

#productos{
 padding:10px;
 display:grid;
 grid-template-columns:1fr;
 gap:16px;
 margin-bottom:100px;
}

@media(min-width:700px){
 #productos{grid-template-columns:repeat(3,1fr)}
}

.producto{
 background:white;
 border-radius:14px;
 padding:12px;
 text-align:center;
 box-shadow:0 2px 8px rgba(0,0,0,.12);
 transition:.2s;
}

.producto:active{transform:scale(.98)}

.producto img{
 width:100%;
 border-radius:12px;
}

.precio{
 color:#88003d;
 font-weight:700;
 font-size:22px;
}

.controles{
 display:flex;
 justify-content:center;
 gap:14px;
 margin-top:6px;
}

.controles button{
 width:42px;
 height:42px;
 font-size:24px;
 background:#88003d;
 color:white;
 border:none;
 border-radius:10px;
}

.cantidad{font-size:20px}

/* Burbuja flotante */

#burbuja{
 position:fixed;
 bottom:16px;
 right:16px;
 background:#88003d;
 color:white;
 padding:10px 14px;
 border-radius:999px;
 box-shadow:0 4px 12px rgba(0,0,0,.3);
 display:flex;
 gap:10px;
 align-items:center;
 font-size:14px;
 cursor:pointer;
 transform:scale(0);
 transition:.3s cubic-bezier(.34,1.56,.64,1);
}

#burbuja.activa{transform:scale(1)}

#burbuja span{font-weight:bold}

/* Panel carrito */

#panel{
 position:fixed;
 left:0;
 right:0;
 bottom:-100%;
 background:white;
 border-radius:20px 20px 0 0;
 padding:12px;
 height:90%;
 transition:.4s cubic-bezier(.34,1.56,.64,1);
 overflow:auto;
 box-shadow:0 -4px 16px rgba(0,0,0,.25);
}

#panel.activo{bottom:0}

input,select{
 width:100%;
 padding:8px;
 margin:4px 0;
 border:1px solid #ccc;
 border-radius:6px;
}

#lista{font-size:14px}

#mensajeMinimo,#mensajeDatos{
 color:#88003d;
 font-size:13px;
 display:none;
}

#enviar{
 width:100%;
 padding:12px;
 background:#25D366;
 border:none;
 border-radius:10px;
 color:white;
 font-size:18px;
}

#enviar:disabled{background:#ccc}

/* animación sumar */

@keyframes pop{
 0%{transform:scale(1)}
 50%{transform:scale(1.15)}
 100%{transform:scale(1)}
}

.pop{animation:pop .25s}
</style>
</head>

<body>

<header>DistriSnacks</header>

<div id="productos"></div>

<!-- Burbuja flotante -->
<div id="burbuja" onclick="abrir()">
🛒 <span id="items">0</span> | $<span id="totalBarra">0</span>
</div>

<!-- Panel carrito -->
<div id="panel">

<button onclick="cerrar()">⬇ Cerrar</button>

<div id="lista"></div>

<h3>Total: $<span id="total"></span></h3>

<input id="cliente" placeholder="Nombre cliente">
<input id="negocio" placeholder="Negocio">
<input id="direccion" placeholder="Dirección">

<select id="tipo">
<option value="">Cliente nuevo/existente</option>
<option>Nuevo</option>
<option>Existente</option>
</select>

<div id="mensajeDatos">Debes diligenciar los datos del cliente.</div>
<div id="mensajeMinimo">Pedido mínimo $25.000</div>

<button id="enviar" onclick="whatsapp()" disabled>Enviar pedido</button>

</div>

<script>
let carrito={};
const PEDIDO_MINIMO=25000;

const SHEET="https://docs.google.com/spreadsheets/d/1ICjjEbQBt2Ce9vGj6M3iOMPT9P2ldYVeDLbzV15LMhI/export?format=csv&gid=1965298886";

fetch(SHEET).then(r=>r.text()).then(csv=>{
 csv.split(/\r?\n/).slice(1).forEach(f=>{
  if(!f)return;
  const c=f.split(",");
  const nombre=c[1]?.replace(/"/g,"");
  const precio=parseInt((c[2]||"").replace(/[^\d]/g,""));
  const img=c[3]?.replace(/"/g,"");
  const activo=c[4]?.replace(/"/g,"").toUpperCase();
  if(!nombre||!precio||activo!=="SI")return;

  productos.innerHTML+=`
  <div class="producto" data-nombre="${nombre}" data-precio="${precio}">
   ${img?`<img src="${img}">`:""}
   <div>${nombre}</div>
   <div class="precio">$${precio.toLocaleString()}</div>
   <div class="controles">
    <button onclick="cambiar(this,-1)">−</button>
    <span class="cantidad">0</span>
    <button onclick="cambiar(this,1)">+</button>
   </div>
  </div>`;
 });
});

function cambiar(btn,v){
 const p=btn.closest(".producto");
 const s=p.querySelector(".cantidad");
 let c=parseInt(s.innerText)||0;
 c=Math.max(0,c+v);
 s.innerText=c;

 s.classList.add("pop");
 setTimeout(()=>s.classList.remove("pop"),200);

 const n=p.dataset.nombre;
 const pr=parseInt(p.dataset.precio);
 if(c===0)delete carrito[n];
 else carrito[n]={pr,c};
 render();
}

function render(){
 let h="",t=0,i=0;
 for(let k in carrito){
  t+=carrito[k].pr*carrito[k].c;
  i+=carrito[k].c;
  h+=`${carrito[k].c} x ${k}<br>`;
 }

 lista.innerHTML=h;
 total.innerText=t.toLocaleString();
 totalBarra.innerText=t.toLocaleString();
 items.innerText=i;

 if(i>0) burbuja.classList.add("activa");
 else burbuja.classList.remove("activa");

 const ok=cliente.value&&negocio.value&&direccion.value&&tipo.value;

 mensajeDatos.style.display=ok?"none":"block";
 mensajeMinimo.style.display=t>=PEDIDO_MINIMO?"none":"block";

 enviar.disabled=!(ok&&t>=PEDIDO_MINIMO);
}

["cliente","negocio","direccion","tipo"].forEach(id=>{
 document.getElementById(id).addEventListener("input",render);
});

function abrir(){panel.classList.add("activo")}
function cerrar(){panel.classList.remove("activo")}

function whatsapp(){
 let m=`Pedido DistriSnacks:%0ACliente:${cliente.value}%0ANegocio:${negocio.value}%0ADirección:${direccion.value}%0ATipo:${tipo.value}%0A`;
 for(let k in carrito){
  m+=`${carrito[k].c} x ${k}%0A`;
 }
 m+=`Total $${total.innerText}`;
 window.open("https://wa.me/573222643534?text="+m);
}
</script>

</body>
</html>
