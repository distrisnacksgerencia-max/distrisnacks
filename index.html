<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DistriSnacks</title>

<style>
:root{--c:#88003d}
*{box-sizing:border-box;font-family:Calibri}

body{margin:0;background:#fafafa}

header{
background:var(--c);
padding:10px;
position:sticky;
top:0;
z-index:50;
}

header input{
width:100%;
padding:10px;
border-radius:8px;
border:none;
font-size:16px;
}

#wrap{display:flex}

#side{
width:220px;
background:#fff;
border-right:1px solid #ddd;
padding:10px;
position:fixed;
top:60px;
bottom:0;
overflow:auto;
transform:translateX(0);
transition:.3s;
z-index:20;
}

#side.hide{transform:translateX(-100%)}

#main{margin-left:220px;padding:10px;width:100%}

@media(max-width:768px){
#side{top:55px}
#main{margin-left:0}
.grid{grid-template-columns:repeat(2,1fr)!important}
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
}

.card{
background:#fff;
border-radius:14px;
padding:10px;
text-align:center;
box-shadow:0 2px 6px rgba(0,0,0,.08)
}

.card img{max-width:100%;height:120px;object-fit:contain}

.price{color:var(--c);font-weight:bold;font-size:18px}

.ctrl{
display:flex;
justify-content:center;
gap:6px;
margin-top:6px
}

.ctrl button{
background:var(--c);
color:#fff;
border:none;
width:32px;
height:32px;
border-radius:8px;
font-size:18px
}

.ctrl input{
width:60px;
text-align:center;
border-radius:6px;
border:1px solid #ccc;
font-size:16px
}

/* quitar flechas */
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{
-webkit-appearance:none;margin:0
}
input[type=number]{-moz-appearance:textfield}

#cart{
position:fixed;
bottom:0;
left:0;
right:0;
background:#fff;
border-top:2px solid var(--c);
padding:8px;
z-index:40
}

#cartList{max-height:140px;overflow:auto;font-size:13px}

#send{
background:#25d366;
border:none;
color:#fff;
width:100%;
padding:12px;
border-radius:10px;
margin-top:6px;
font-size:16px
}

footer{
background:#000;
color:#fff;
padding:15px;
text-align:center;
margin-top:160px
}
</style>
</head>

<body>

<header>
<input id="search" placeholder="Buscar productos...">
</header>

<div id="wrap">
<div id="side">
<h3>Categorías</h3>
<div id="cats"></div>
<button onclick="showAll()">Todos</button>
</div>

<div id="main">
<div class="grid" id="productos"></div>
</div>
</div>

<div id="cart">
<div><b>Pedido</b></div>
<div id="cartList"></div>
<div>Total: $<span id="total">0</span> | <span id="units">0</span> und</div>

<input id="nombre" placeholder="Nombre">
<input id="dir" placeholder="Dirección">
<input id="neg" placeholder="Negocio">
<select id="nuevo">
<option value="">Cliente?</option>
<option>Nuevo</option>
<option>Existente</option>
</select>

<button id="send">Enviar pedido</button>
</div>

<footer>
<b>DISTRISNACKS</b><br>
Bogotá<br>
3222643534<br>
Distrisnacksgerencia@gmail.com<br>
L–V 8–6 | S 8–1<br>
Tu aliado en distribución TAT
</footer>

<script>
const SHEET="https://docs.google.com/spreadsheets/d/e/2PACX-1vTbugSqKIqAJ2ulSdijJDb94_ENrqE1mtXs2yo1Yz3wjxY7Jers8hh3TDJ4sxoA6CwJ2cIHGwVWGx0I/gviz/tq?tqx=out:json";

const MAX=999,MINPED=25000;

let productos=[],carrito={};

fetch(SHEET).then(r=>r.text()).then(t=>{
const j=JSON.parse(t.substr(47).slice(0,-2)).table.rows;

j.forEach(r=>{
if(r.c[4]?.v!=="SI")return;

productos.push({
n:r.c[1]?.v,
p:parseInt(String(r.c[2]?.v).replace(/\D/g,"")),
img:r.c[3]?.v,
cat:r.c[7]?.v||"Otros"
});
});

renderProductos();
buildCats();
});

function renderProductos(list=productos){
const g=document.getElementById("productos");
g.innerHTML="";
list.forEach(p=>{
g.innerHTML+=`
<div class="card">
<img src="${p.img}">
<div>${p.n}</div>
<div class="price">$${p.p}</div>
<div class="ctrl">
<button onclick="chg('${p.n}',-1)">−</button>
<input type="number" min="0" max="${MAX}" value="${carrito[p.n]?.c||0}"
oninput="set('${p.n}',this.value)">
<button onclick="chg('${p.n}',1)">+</button>
</div>
</div>`;
});
}

function chg(n,v){
let c=(carrito[n]?.c||0)+v;
if(c>MAX)c=MAX;if(c<0)c=0;
if(c<=0)delete carrito[n];
else carrito[n]={c,pr:productos.find(x=>x.n===n).p};
render();
renderProductos();
}

function set(n,v){
if(v==="")return;
let num=parseInt(v);
if(isNaN(num))return;
if(num>MAX)num=MAX;
if(num<0)num=0;
if(num<=0)delete carrito[n];
else carrito[n]={c:num,pr:productos.find(x=>x.n===n).p};
render();
renderProductos();
}

function render(){
let t=0,u=0,h="";
for(let k in carrito){
let s=carrito[k].c*carrito[k].pr;
t+=s;u+=carrito[k].c;
h+=`${carrito[k].c} x ${k} = $${s}<br>`;
}
cartList.innerHTML=h;
total.innerText=t;
units.innerText=u;
}

send.onclick=()=>{
if(!nombre.value||!dir.value||!neg.value||!nuevo.value)
return alert("Completa tus datos");

let tot=parseInt(total.innerText);
if(tot<MINPED)return alert("Pedido mínimo $25.000");

let m=`Pedido DistriSnacks%0A`;
for(let k in carrito){
m+=`${carrito[k].c} x ${k}%0A`;
}
m+=`%0ATotal $${tot}%0A${nombre.value}%0A${dir.value}%0A${neg.value}%0A${nuevo.value}`;
window.open("https://wa.me/573222643534?text="+m);
carrito={};render();renderProductos();
}

search.oninput=()=>{
let q=search.value.toLowerCase();
renderProductos(productos.filter(p=>p.n.toLowerCase().includes(q)));
}

function buildCats(){
let s=[...new Set(productos.map(p=>p.cat))];
cats.innerHTML="";
s.forEach(c=>{
cats.innerHTML+=`<div onclick="filter('${c}')">${c}</div>`;
});
}

function filter(c){renderProductos(productos.filter(p=>p.cat==c))}
function showAll(){renderProductos()}
</script>

</body>
</html>
